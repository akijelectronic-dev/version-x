<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERSION X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- Splash -->
<div id="splash" class="splash">
  <div class="globe" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="splash-text">Initializing Neural Network...</p>
  <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
</div>

<div id="lock" class="lock" hidden>
  <div class="lock-box glass">
    <h2 class="logo">VERSION <b>X</b></h2>
    <p id="lock-msg"></p>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="PIN">
    <button id="pin-btn" class="send">UNLOCK</button>
    <p id="lock-err" class="err-text" role="alert"></p>
    <button id="forgot" class="link-btn">PIN ভুলে গেছি (সব হিস্ট্রি মুছে যাবে)</button>
  </div>
</div>

<div id="cam" class="cam" hidden>
  <video id="cam-video" playsinline muted autoplay></video>
  <canvas id="cam-canvas" hidden></canvas>
  <div class="cam-bar">
    <div id="cam-caption" class="cam-caption" hidden></div>
    <div id="cam-ask" class="cam-ask" hidden>
      <input id="cam-q" type="text" placeholder="ছবি সম্পর্কে কী জানতে চান?" autocomplete="off">
      <div class="cam-row"><button id="cam-retake" class="link-btn">আবার তুলুন</button><button id="cam-send" class="send">SEND</button></div>
    </div>
    <div id="cam-ctl" class="cam-ctl">
      <button class="icon-btn" id="cam-flip" aria-label="Flip camera"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12a8 8 0 0 1 13.5-5.8L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.5 5.8L4 15.5M4 20v-4.5h4.5"/></svg></button>
      <button id="cam-live" class="live-btn" aria-label="Live mode">LIVE</button>
      <button id="cam-shot" class="shot" aria-label="Take photo"></button>
      <button class="icon-btn" id="cam-close" aria-label="Close camera"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <h1 class="logo">VERSION <b>X</b></h1>
    <div class="tools">
      <button class="icon-btn" id="settings-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
    </button>
      <div id="menu" class="menu glass" hidden>
        <button id="lock-btn">এখনই লক করুন</button>
        <button id="brain-btn">ব্রেইন দেখুন</button>
        <button id="brain-clear">ব্রেইন মুছুন</button>
        <button id="contact-btn">পরিচিতি যোগ করুন</button>
        <button id="clear-btn">হিস্ট্রি মুছুন</button>
      </div>
    </div>
  </header>

  <section class="transcript glass" aria-label="Transcript">
    <div class="panel-title">TRANSCRIPT</div>
    <div id="transcript-log" class="log" aria-live="polite">
      <p class="line sys">&gt; সিস্টেম প্রস্তুত। Manager Agent অনলাইন।</p>
    </div>
  </section>

  <section class="core" aria-label="Agent network">
    <div class="stage">
      <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M38 9.6 C44 9.6 44 47 49 47" stroke="#00d2ff"/>
        <path d="M38 36.5 C44 36.5 44 49 49 49" stroke="#00ff88"/>
        <path d="M38 63.5 C44 63.5 44 51 49 51" stroke="#ff8a3d"/>
        <path d="M38 90.4 C44 90.4 44 53 49 53" stroke="#e0e0e0"/>
      </svg>
      <div class="nodes">
        <button class="node" data-agent="memory"><span class="dot"></span>MEMORY</button>
        <button class="node" data-agent="chat"><span class="dot"></span>CHAT</button>
        <button class="node" data-agent="coder"><span class="dot"></span>CODER</button>
        <button class="node" data-agent="writer"><span class="dot"></span>WRITER</button>
      </div>
      <div class="sphere" id="sphere" aria-hidden="true"><i></i><i></i><i></i></div>
      <span id="status" class="status" aria-live="polite">STANDBY</span>
    </div>
  </section>

  <div class="controls">
    <button id="stop-btn" class="stop">STOP</button>
    <button class="icon-btn" id="tts-btn" aria-label="Voice reply" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></button>
  </div>

  <section class="room glass" aria-label="Agent room">
    <div class="room-head"><span class="mgr" id="mgr"><i class="mgr-dot"></i>MANAGER</span><span id="mgr-status">কাজের অপেক্ষায়</span></div>
    <div class="room-agents">
      <div class="agent" data-agent="memory" data-state="idle"><div class="bot"><i class="head"></i><i class="body"></i></div><b>MEMORY</b><small>বসে আছে</small></div>
      <div class="agent" data-agent="chat" data-state="idle"><div class="bot"><i class="head"></i><i class="body"></i></div><b>CHAT</b><small>বসে আছে</small></div>
      <div class="agent" data-agent="coder" data-state="idle"><div class="bot"><i class="head"></i><i class="body"></i></div><b>CODER</b><small>বসে আছে</small></div>
      <div class="agent" data-agent="writer" data-state="idle"><div class="bot"><i class="head"></i><i class="body"></i></div><b>WRITER</b><small>বসে আছে</small></div>
    </div>
  </section>

  <section class="tasks glass" aria-label="Tasks">
    <div class="task-head"><span>TASKS</span><span id="task-left">0 left</span></div>
    <div class="task-progress"><div id="task-bar"></div></div>
    <ul id="task-list"></ul>
    <div class="task-add">
      <input id="task-input" type="text" placeholder="নতুন কাজ লিখুন" maxlength="80" autocomplete="off">
      <button id="task-add" aria-label="Add task">+</button>
    </div>
  </section>

  <footer class="inputbar glass">
    <input id="text-input" type="text" placeholder="এজেন্টকে কমান্ড দিন..." autocomplete="off">
    <button class="icon-btn" id="cam-btn" aria-label="Camera"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
    <button class="mic" id="mic-btn" aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="send" id="send-btn" aria-label="Send">SEND</button>
  </footer>
</div>

<script src="js/api.js"></script>
<script src="js/voice.js"></script>
<script src="js/crypto.js"></script>
<script src="js/phone.js"></script>
<script src="js/camera.js"></script>
<script src="js/app.js"></script>
</body>
</html>
